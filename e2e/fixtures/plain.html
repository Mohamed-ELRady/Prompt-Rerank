<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prompt Rerank fixture: plain fields</title>
  </head>
  <body>
    <h1>Plain fields</h1>
    <textarea id="ta" rows="4" cols="60">write me a poem about the sea</textarea>
    <div
      id="ce"
      contenteditable="true"
      style="border: 1px solid #999; padding: 8px; width: 480px; min-height: 60px"
    >
      summarize this article for me quickly
    </div>
  </body>
</html>
